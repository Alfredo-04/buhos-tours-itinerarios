[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores personalizados para segmentar la ejecución
markers =
    funcional: Pruebas funcionales de reglas de negocio, algoritmos y control de acceso (RBAC)
    no_funcional: Pruebas no funcionales de rendimiento, memoria, seguridad y concurrencia
    rendimiento: Pruebas de velocidad, tiempo de respuesta y latencia
    seguridad: Pruebas de inyección SQL, XSS y protección de rutas
    concurrencia: Pruebas de estrés y peticiones concurrentes

# Opciones por defecto para salida limpia y legible en terminal
addopts = -v --tb=short -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
